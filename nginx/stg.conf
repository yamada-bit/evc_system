server {
    listen 80;
    server_name stg.sysbevc.com;
    # server_name _;  # ← localhost など任意のHostを受け入れる    
    access_log /dev/stdout;
    error_log  /dev/stderr;

    if (-f /etc/nginx_stg/maintenance.flag) {
        return 503;
    }
    error_page 503 @maintenance;

    location @maintenance {
        return 503 "Maintenance";
    }

    location /static/ {
        alias /staticfiles/;
    }
    # ユーザーデータ
    location /EvcData/ {
        alias /data_root/evc_root/;
    }
    location /help/ {
        alias /data_root/evc_help/;
    }

    location /media/ {
        alias /data_root/media/;
    }
    location / {
        proxy_pass http://web_stg:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 追加推奨
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}
