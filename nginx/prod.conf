# =========================
# HTTP（認証用）
# =========================
server {
    listen 80;
    server_name www.sysbevc.com;

    # certbot webroot用
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location /health {
        access_log off;
        return 200 "ok";
    }
    # HTTP → HTTPS リダイレクト
    location / {
        # return 200 "ok";  # 開発・証明書取得時
        return 301 https://$host$request_uri;
    }
}
# ===== 本番 =====
server {
    listen 443 ssl http2;
    server_name www.sysbevc.com;
    access_log /dev/stdout;
    error_log  /dev/stderr;

    # SSL証明書の設定（パスは環境に合わせて変更）
    ssl_certificate     /etc/letsencrypt/live/www.sysbevc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.sysbevc.com/privkey.pem;
    # TLS
    ssl_protocols TLSv1.2 TLSv1.3;
    # SSLセッションの最適化
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # セキュリティヘッダー
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy same-origin;
    # gzip
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;

    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml;

    client_max_body_size 50M;
    # ========== ここから追加 ==========
    if (-f /etc/nginx/maintenance.flag) {
        return 503;
    }
    error_page 503 @maintenance;

    location @maintenance {
        return 503 "Maintenance";
    }

    # location @maintenance {
    #     root /var/www;
    #     rewrite ^(.*)$ /maintenance.html break;
    # }
    # ========== ここまで追加 ==========    
    # 静的ファイル
    location /static/ {
        # proxy_pass http://web:8000/static/;
        alias /staticfiles/;
        expires 30d; #静的ファイルに expires や cache-control を付けると高速化
        add_header Cache-Control "public";
        access_log off;
    }
    # # データディレクトリ
    # location /data_root/ {
    #     alias /data_root/;
    # }
    # ヘルプファイル
    location /help/ {
        alias /data_root/evc_help/;
    }
    # ユーザーデータ
    location /EvcData/ {
        alias /data_root/evc_root/;
    }
    location /media/ {
        alias /data_root/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }
}