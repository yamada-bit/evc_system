# version: '3.9'

services:
  db_stg:
    image: postgres:16
    container_name: pg16_stg
    restart: always
    env_file:
      - .env.stg
    volumes:
      - pgdata_stg:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
  web_stg:
    # build:
    #   context: .
    #   dockerfile: docker/Dockerfile.prod
    # image: evc_web:${IMAGE_TAG}
    image: evc_web:${IMAGE_TAG:-stg}  # IMAGE_TAGなければ stg使う
    container_name: evc_web_stg
    restart: always
    command: >
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 4
      --access-logfile -
      --error-logfile -
      --log-level info
    volumes:
      - ./evc_pj/static_stg:/staticfiles
      - ./data_root_stg:/data_root
      - ./Google:/Google_data
    env_file:
      - .env.stg
    depends_on:
      - db_stg
    environment:
      # migrateはdeply_stg.shで実行
      # - RUN_MIGRATE=1   # migrate ON entrypoint.shで実行
      # Google Calendar http運用なのにoauthlibがhttps必須と拒否するので設定
      - OAUTHLIB_INSECURE_TRANSPORT=1
      - ENV_FILE=.env.stg
    logging:
      driver: "json-file"
      options:
        max-size: "10m" # 10MBごとにローテーション
        max-file: "5" # 最大5世代保存
  nginx_stg:
    image: nginx:stable
    container_name: nginx_stg
    restart: always
    ports:
      # - "443:443"
      - "8080:80"
      # - "8443:443"
    volumes:
      - ./nginx/stg.conf:/etc/nginx/conf.d/default.conf
      - ./evc_pj/static_stg:/staticfiles:ro
      - ./data_root_stg:/data_root
      # - certbot_conf_stg:/etc/letsencrypt
      # - certbot_www_stg:/var/www/certbot
    depends_on:
      - web_stg
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # certbot_stg:
  #   image: certbot/certbot
  #   container_name: certbot_stg
  #   volumes:
  #     - certbot_conf_stg:/etc/letsencrypt
  #     - certbot_www_stg:/var/www/certbot
  #   entrypoint: >
  #     sh -c "trap exit TERM; while :; do
  #       certbot renew --webroot -w /var/www/certbot --quiet;
  #       sleep 12h & wait $${!};
  #     done;"
volumes:
  pgdata_stg:
