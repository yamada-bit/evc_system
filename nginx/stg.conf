server {
    listen 443 ssl;
    http2 on;
    server_name stg.sysbevc.com;
    access_log /dev/stdout;
    error_log  /dev/stderr;

    # Prodと同じletsencryptボリューム内にある stg.sysbevc.com 用証明書
    ssl_certificate     /etc/letsencrypt/live/stg.sysbevc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stg.sysbevc.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    if (-f /etc/nginx_stg/maintenance.flag) {
        return 503;
    }
    error_page 503 @maintenance;

    location @maintenance {
        return 503 "Maintenance";
    }

    location /static/ {
        alias /staticfiles/;
    }
    # ユーザーデータ
    location /EvcData/ {
        alias /data_root/evc_root/;
    }
    location /help/ {
        alias /data_root/evc_help/;
    }

    location /media/ {
        alias /data_root/media/;
    }

    location / {
        proxy_pass http://web_stg:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 8443;
    }
}