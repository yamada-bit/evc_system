# =========================================================
# HTTP (80番) 用サーバ
# - Let's Encrypt の認証
# - HTTPS へのリダイレクト
# - ヘルスチェック応答
# =========================================================
server {
    # HTTP待受
    listen 80;
    # 対象ドメイン
    server_name www.sysbevc.com;

    # Let's Encrypt 認証用
    # certbot が配置した challenge ファイルを返す
    location /.well-known/acme-challenge/ {
        # certbot コンテナと共有しているディレクトリ
        root /var/www/certbot;
    }
    # ヘルスチェック用
    # ALB / nginx監視 / コンテナ監視などで利用可能
    location /health {
        # healthチェックはログ不要
        access_log off;
        # 200 OK を返却
        return 200 "ok";
    }
    # それ以外のHTTPアクセスはHTTPSへリダイレクト
    # 
    location / {
        # return 200 "ok";  # 開発・証明書取得時
        # 元のパス・クエリを維持してHTTPSへ転送
        return 301 https://$host$request_uri;
    }
}
# =========================================================
# HTTPS (443番) 用サーバ
# Djangoアプリへのリバースプロキシ
# =========================================================
server {
    # HTTPS待受
    listen 443 ssl http2;
    # 対象ドメイン
    server_name www.sysbevc.com;
    # Docker向けログ出力
    # docker logs nginx_prod で確認可能
    access_log /dev/stdout;
    error_log  /dev/stderr;

    # =====================================================
    # SSL/TLS設定
    # =====================================================
    # Let's Encrypt の証明書
    ssl_certificate     /etc/letsencrypt/live/www.sysbevc.com/fullchain.pem;
    # 秘密鍵
    ssl_certificate_key /etc/letsencrypt/live/www.sysbevc.com/privkey.pem;
    # 使用するTLSバージョン
    # TLS1.0/1.1は脆弱性があるため無効化
    ssl_protocols TLSv1.2 TLSv1.3;
    # SSLセッションの最適化
    # SSLセッション有効期間
    ssl_session_timeout 1d;
    # SSLセッションキャッシュ
    ssl_session_cache shared:SSL:10m;
    # セッションチケット無効化
    # セキュリティ向上目的
    ssl_session_tickets off;

    # =====================================================
    # セキュリティヘッダ
    # =====================================================
    # iframe埋め込み制限
    add_header X-Frame-Options SAMEORIGIN;
    # MIMEタイプ推測防止
    add_header X-Content-Type-Options nosniff;
    # Referer送信制御
    add_header Referrer-Policy same-origin;
    # =====================================================
    # gzip圧縮
    # レスポンスサイズ削減による高速化
    # =====================================================
    gzip on;
    # 圧縮レベル
    # 1〜9 (高いほどCPU負荷増)
    gzip_comp_level 5;
    # このサイズ以上のみ圧縮
    gzip_min_length 256;

    # 圧縮対象MIMEタイプ
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml;

    # =====================================================
    # アップロードサイズ制限
    # =====================================================
    # Djangoへの最大アップロードサイズ
    client_max_body_size 50M;

    # =====================================================
    # メンテナンスモード
    # maintenance.flag が存在する場合503を返す
    # =====================================================

    # ファイル存在チェック
    if (-f /etc/nginx/maintenance.flag) {
        return 503;
    }
    # 503発生時の遷移先
    error_page 503 @maintenance;

    # メンテナンス応答
    location @maintenance {
        # 必要なら静的HTMLページ返却にも変更可能
        return 503 "Maintenance";
    }
    # location @maintenance {
    #     root /var/www;
    #     rewrite ^(.*)$ /maintenance.html break;
    # }
    # =====================================================
    # 静的ファイル
    # collectstatic の出力先
    # =====================================================
    location /static/ {
        # Docker volume を参照
        alias /staticfiles/;
        # ブラウザキャッシュ期間
        expires 30d; #静的ファイルに expires や cache-control を付けると高速化
        # public cache指定
        add_header Cache-Control "public";
        # staticログは通常不要
        access_log off;
    }
    # ヘルプファイル
    location /help/ {
        alias /data_root/evc_help/;
    }
    # ユーザーデータ
    location /EvcData/ {
        alias /data_root/evc_root/;
    }
    # =====================================================
    # メディアファイル
    # ユーザーアップロードファイル
    # =====================================================
    location /media/ {
        # media保存先
        alias /data_root/media/;
        # キャッシュ期間
        expires 7d;
    }
    # =====================================================
    # Djangoアプリへリバースプロキシ
    # =====================================================
    location / {
        # Docker Compose の service名:web
        proxy_pass http://web:8000;
        # 元HostヘッダをDjangoへ転送
        proxy_set_header Host $host;
        # クライアントIP
        proxy_set_header X-Real-IP $remote_addr;
        # プロキシ経由IPチェーン
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # HTTP/HTTPS判定用
        proxy_set_header X-Forwarded-Proto $scheme;
        # 元Host情報
        proxy_set_header X-Forwarded-Host $host;
        # 元ポート情報
        proxy_set_header X-Forwarded-Port 443;
    }
}