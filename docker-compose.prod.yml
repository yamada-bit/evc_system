# version: '3.9'
# Docker Compose v2 では version 指定不要

services:
  # ---------------------------
  # PostgreSQL データベース
  # 本番では外部に公開しない
  # Windows から pgAdmin で接続する場合は
  # SSHトンネル経由で localhost:15432 → サーバー内 localhost:5432
  # ---------------------------
  db:
    # PostgreSQL 16 利用
    image: postgres:16
    # 固定コンテナ名
    container_name: pg16
    # 異常終了時やサーバ再起動時に自動起動
    restart: always
    # DB接続情報などを.env.prodから読み込み
    env_file:
      - .env.prod
    # DBデータ永続化
    volumes:
      - pgdata:/var/lib/postgresql/data
    # ports:
    #   - "5432:5432"
    # expose:
    # - "5432"   # ← portsにしない
    # 一時的に ports を開ける SSHトンネルpgadmin4接続のため
    # localhostのみ公開
    # 外部ネットワークからは接続不可
    ports:
      # localhost のみ公開
      # 外部公開防止
      - "127.0.0.1:5432:5432"  # ← SSHトンネル用（外部非公開）    
    # networks:
    #   - evc_network
    # Dockerログローテーション
    logging:
      driver: "json-file"
      options:
        # 1ファイル50MBまで
        max-size: "50m"
        # 最大5世代保持
        max-file: "5"
  ####################################################################
  # Django + Gunicorn
  ####################################################################
  web:
    # build:
    #   context: .
    #   dockerfile: docker/Dockerfile.prod
    # deploy_prod.sh で作成した image tag を利用
    image: evc_web:${IMAGE_TAG}
    # image: evc_web:backup_20260331_0835
    container_name: evc_web
    # 本番環境や特定の検証環境に合わせて、Compose側でワーカー数を指定します。
    # command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4
    restart: always
    # Gunicorn起動
    command: >
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 4
      --access-logfile -
      --error-logfile -
      --log-level info
    # # Dockerコンテナが起動した際に Djangoの「開発用サーバー」を立ち上げる
    # # 0.0.0.0: サーバーを「外部（ホストPCなど）からのアクセスをすべて受け付ける状態」
    # # command: python manage.py runserver 0.0.0.0:8000
    # command: sleep infinity  # コンテナを維持するだけの命令に変更
    # コードはイメージ内にコピー済み、本番ではマウント不要
    # 静的ファイルとデータディレクトリのみマウント
    # collectstatic後のstaticを共有
    volumes:
      # collectstatic 出力先
      # nginx と共有
      - ./evc_pj/static:/staticfiles
      # media 等永続データ
      - ./data_root:/data_root  # ホストの ./data_root をコンテナの /data_root に繋ぐ
      - ./Google:/Google_data

    # volumes:
    #   - /home/deploy/projects/evc_system/evc_pj:/app
    #   - /home/deploy/projects/evc_system/evc_pj/static:/staticfiles
    #   - /home/deploy/projects/evc_system/data_root:/data_root
      # - ./data_root/media:/media
    # 「Docker単体確認段階」で必要
    # ports:
    #   - "8000:8000"
    env_file:
      - .env.prod
    depends_on:
      # DB起動後にweb起動
      # DB ready までは保証しない
      - db
    # settings.pyでENV_FILEを参照するため
    environment:
      # Django settings.py で参照
      - ENV_FILE=.env.prod
    # 「本番」で必要
    # expose:
    #   - "8000"
    # environment:
    #   - DJANGO_SETTINGS_MODULE=config.settings
    # networks:
    #   - evc_network
    # Gunicornログローテーション
    logging:
      driver: "json-file"
      options:
        max-size: "10m" # 10MBごとにローテーション
        max-file: "5" # 最大5世代保存
  # # ---------------------------
  # # 追加（jaf用）
  # # ---------------------------
  # web_jaf:
  #   build:
  #     context: ./jaf_pj   # ← jafプロジェクトのディレクトリ
  #     dockerfile: docker/Dockerfile.prod
  #   container_name: jaf_web
  #   restart: always
  #   command: >
  #     gunicorn config.wsgi:application
  #     --bind 0.0.0.0:8000
  #     --workers 2
  #   volumes:
  #     - ./jaf_pj/static:/staticfiles
  #     - ./jaf_data:/data_root
  #   env_file:
  #     - .env.prod
  #   depends_on:
  #     - db

  # ---------------------------
  # Nginx リバースプロキシ
  # 静的ファイル + Django アプリを公開
  # ---------------------------
  nginx:
    # stable版 nginx
    image: nginx:stable
    container_name: nginx_prod
    restart: always
    ports:
      - "80:80"   # HTTP公開（必要に応じて443も）
      # HTTPS
      - "443:443"
    volumes:
      # nginx設定
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf
      # Let's Encrypt challenge用
      # certbotと共有
      - certbot_www:/var/www/certbot
      # 証明書保存領域
      # certbotと共有
      - certbot_conf:/etc/letsencrypt
      # - certbot_www_stg:/var/www/certbot_stg  # 追加      
      # - certbot_www:/var/www/certbot
      # - certbot_conf:/etc/letsencrypt
      # - ./certbot/www:/var/www/certbot
      # - ./certbot/conf:/etc/letsencrypt
      # Django static配信
      - ./evc_pj/static:/staticfiles:ro
      # - ./jaf_pj/static:/jaf_static:ro
      - ./data_root:/data_root
      # - ./data_root/evc_root:/data_root/EvcData
      # - ./data_root/evc_help:/data_root/help:ro
      # - ./data_root/media:/data_root/media
      # - ./data_root/evc_root:/EvcData
      # - ./data_root/evc_help:/help:ro
      # - ./data_root/media:/media
      # - ./jaf_data:/jaf_data
    depends_on:
      # Django 起動後 nginx 起動
      - web
      # - web_jaf
    # networks:
    #   - evc_network
    # nginxログローテーション
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
  # =====================================
  # Certbot (Let's Encrypt 自動更新)
  # =====================================
  certbot:
    image: certbot/certbot
    container_name: certbot_prod
    restart: always
    volumes:
      # ACME challengeファイル共有    
      - certbot_www:/var/www/certbot
      # 証明書保存領域
      - certbot_conf:/etc/letsencrypt
      # - certbot_www:/var/www/certbot
      # - certbot_conf:/etc/letsencrypt
      # - ./certbot/www:/var/www/certbot
      # - ./certbot/conf:/etc/letsencrypt
      # certbotログ保存
      - ./logs/letsencrypt:/var/log/letsencrypt
    ##################################################################
    # 常駐renew処理
    # 12時間ごとに:
    #   certbot renew
    # renew対象:
    #   有効期限30日前以内のみ
    # --quiet:
    #   正常時ログ抑制
    ##################################################################
    # cron 自動更新
    # TERMシグナルを受けたら exit
    # renew:期限30日前なら更新
    entrypoint:
      - /bin/sh
      - -c
      - |
        trap exit TERM;
        while true; do
          certbot renew --webroot -w /var/www/certbot --quiet;
          sleep 43200 & wait $!;
        done
    # certbotログローテーション
    logging:
      driver: json-file
      options:
        # certbotログは小さめ
        max-size: "10m"
        # 3世代保持
        max-file: "3"
# ---------------------------
# データ永続化ボリューム
# ---------------------------
volumes:
  # PostgreSQLデータ
  pgdata:
  ####################################################################
  # Let's Encrypt challenge共有
  # nginx:
  #   /.well-known/acme-challenge/
  # certbot:
  #   challengeファイル生成
  ####################################################################
  certbot_www:
  ####################################################################
  # Let's Encrypt証明書保存
  # 保存内容:
  #   live/
  #   archive/
  #   renewal/
  ####################################################################
  certbot_conf:
  # certbot_www_stg:  # 追加  
